rpc_url: "${RPC_URL}"
private_key: "${PRIVATE_KEY}"

# How often to poll Credora and update vault fees.
poll_interval: "24h"

credora_api_url: "https://api.credora.io/v1"
credora_api_key: "${CREDORA_API_KEY}"

# Safety bounds applied to the calculated fee before submitting on-chain.
min_fee_bps: 10    # 0.10%
max_fee_bps: 1000  # 10.00%

vaults:
  - address: "0x0000000000000000000000000000000000000001"
    credora_entity_id: "entity-abc"
  - address: "0x0000000000000000000000000000000000000002"
    credora_entity_id: "entity-xyz"
