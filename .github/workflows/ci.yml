name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  RETENTION_DAYS: 14

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Forge version
        run: forge --version

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.13-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.13-pip-

      - name: Install python dependencies
        run: pip3 install -r requirements.txt

      - name: Clean build artifacts
        run: make clean

      - name: Check code format
        run: make format-check

      - name: Run code linting
        run: make lint

      # - name: Check gas snapshot
      # run: make snapshot-check

      - name: Build contracts
        run: make build

      - name: Run tests
        run: make test-ci

      - name: Run slither analysis
        run: make slither

      - name: Start anvil
        run: |
          nohup anvil --port 8545 --silent &
          for i in {1..15}; do
            if nc -z 127.0.0.1 8545; then
              echo "Anvil instance is up"
              break
            fi
            sleep 1
          done

      - name: Deploy contracts to anvil
        env:
          SLASHING_MANAGER: "0x0000000000000000000000000000000000000002"
          STAKE_MANAGER: "0x0000000000000000000000000000000000000003"
          REWARDS_MANAGER: "0x0000000000000000000000000000000000000004"
          CHAINLINK_PRICE_FEED: "0x0000000000000000000000000000000000000005"
        run: make deploy-anvil

      - name: Generate coverage report
        run: make cover > coverage-report.txt

      - name: Generate gas report
        run: make gas > gas-report.txt

      - name: Generate abis
        run: |
          mkdir -p abis
          for contract in CoverPoolFactory CoverPool ICoverPoolFactory ICoverPool; do
            find out -name "$contract.json" | while read file; do
              dir_name=$(dirname "$file" | sed 's|^out/||')
              mkdir -p "abis/$dir_name"
              jq '.abi' "$file" > "abis/$dir_name/${contract}.json"
            done
          done

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.txt
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Upload gas report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: gas-report.txt
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Upload abis
        uses: actions/upload-artifact@v4
        with:
          name: abis
          path: abis/
          retention-days: ${{ env.RETENTION_DAYS }}
